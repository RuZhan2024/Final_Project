<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="650" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Dataset Roles and Evidence Layers</text>
<text x="650" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">CAUCAFall is the target dataset; LE2i is source/comparison evidence; replay is bounded runtime evidence.</text>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="90" y="150" width="310" height="130" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="245" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CAUCAFall</text><text x="245" y="230" text-anchor="middle" font-size="16" fill="#334155">primary target</text><text x="245" y="255" text-anchor="middle" font-size="16" fill="#334155">c2_bbox W48/S12</text>
<rect x="495" y="150" width="310" height="130" rx="12" fill="#ccfbf1" stroke="#334155" stroke-width="2"/><text x="650" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LE2i</text><text x="650" y="230" text-anchor="middle" font-size="16" fill="#334155">source-domain comparison</text><text x="650" y="255" text-anchor="middle" font-size="16" fill="#334155">not deployment replay</text>
<rect x="900" y="150" width="310" height="130" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="1055" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CAUCAFall+LE2i</text><text x="1055" y="230" text-anchor="middle" font-size="16" fill="#334155">controlled mix25</text><text x="1055" y="255" text-anchor="middle" font-size="16" fill="#334155">selected TCN candidate</text>
<rect x="230" y="390" width="840" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="650" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Validation-fitted operating policy</text><text x="650" y="452" text-anchor="middle" font-size="16" fill="#334155">OP1/OP2/OP3 are research calibration artefacts; OP2 is locked for the app.</text>
<rect x="230" y="555" width="840" height="84" rx="12" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="650" y="590" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Bounded replay and runtime validation</text><text x="650" y="617" text-anchor="middle" font-size="16" fill="#334155">Final TCN mix25 seed42 OP2 + motion gate 0.18: 23/24, TP=12, TN=11, FP=1, FN=0.</text>
</g>
<g stroke="#64748b" stroke-width="2.5" fill="none"><path d="M245 280 C245 330 510 330 510 390"/><path d="M650 280 L650 390"/><path d="M1055 280 C1055 330 790 330 790 390"/><path d="M650 474 L650 555"/></g>
</svg>
